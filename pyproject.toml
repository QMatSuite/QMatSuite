[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qmatsuite"
version = "1.0.1"
description = "QMatSuite calculation backend and automation toolkit for Quantum ESPRESSO and related engines."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "QMatSuite Developers" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "ase",
    "scipy",
    "matplotlib",
    "plotext>=5.2",
    "PyYAML",
    "typer>=0.12",
    "pymatgen>=2024.0.0",
    "ulid-py>=1.1",
    "msgpack>=1.0.0",
    "requests>=2.25.0",
    "certifi>=2023.7.22",
    "portalocker>=2.8,<3",
    "jinja2>=3.0.0",
    "fastmcp>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0"
]
# Materials Project native API (optional, requires API key)
mp-api = [
    "mp-api>=0.30.0"
]
# MCP server extra retained for backwards compatibility.
# fastmcp is now a core dependency.
mcp = [
    "fastmcp>=2,<3"
]
# All optional dependencies
all = [
    "mp-api>=0.30.0",
    "fastmcp>=2,<3"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "data/*.json",
    "drivers/**/data/*.json",
    "resources/**/*",
]

[project.scripts]
qms = "qmatsuite.cli:app"
