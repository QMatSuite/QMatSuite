[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantumvitas"
version = "1.0.1"
description = "Python rewrite of QuantumVITAS - a workflow engine and GUI layer for Quantum ESPRESSO and related codes."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "QuantumVITAS Developers" }]
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "matplotlib",
    "PyYAML",
    "typer>=0.12",
    "beautifulsoup4>=4.12",
    "pymatgen>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"quantumvitas" = ["data/*.json"]


