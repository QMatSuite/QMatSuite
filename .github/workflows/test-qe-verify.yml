name: Test QE Binary Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            qe_release_tag: "qe-7.5-macos-arm64-openmp-20260225-0c4bfdb"
            qe_asset: "qe-7.5-macos-arm64-openmp.zip"
            binary_name: "pw.x"
          - os: macos-15-intel
            arch: x64
            qe_release_tag: "qe-7.5-macos-x86_64-openmp-20260225-90c770d"
            qe_asset: "qe-7.5-macos-x86_64-openmp.zip"
            binary_name: "pw.x"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download QE binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "=== Downloading ${QE_RELEASE_TAG} ==="
          gh release download "${{ matrix.qe_release_tag }}" \
            --repo QMatSuite/qmatsuite-toolchain \
            --pattern "${{ matrix.qe_asset }}" \
            --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/${{ matrix.qe_asset }}"

      - name: Extract and inspect
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qe-bundle"
          unzip -q "$RUNNER_TEMP/${{ matrix.qe_asset }}" -d "$RUNNER_TEMP/qe-bundle"

          echo "=== Full directory tree ==="
          find "$RUNNER_TEMP/qe-bundle" -type f | sort

          echo ""
          echo "=== Looking for pw.x ==="
          QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.x" -type f | head -1)
          if [[ -z "$QE_PW_PATH" ]]; then
            echo "::error::pw.x not found!"
            exit 1
          fi
          echo "Found: $QE_PW_PATH"
          QE_BIN_DIR=$(dirname "$QE_PW_PATH")
          echo "QE_BIN_DIR=$QE_BIN_DIR"
          echo "QE_BIN_DIR=$QE_BIN_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=== File info ==="
          file "$QE_PW_PATH"
          ls -la "$QE_PW_PATH"

          echo ""
          echo "=== Dynamic libraries ==="
          otool -L "$QE_PW_PATH" 2>&1 | head -30 || true

          echo ""
          echo "=== Quarantine attributes ==="
          xattr "$QE_PW_PATH" 2>&1 || true
          xattr -l "$QE_PW_PATH" 2>&1 || true

      - name: Check environment
        run: |
          echo "=== System info ==="
          uname -a
          sw_vers
          echo ""
          echo "=== timeout command ==="
          which timeout 2>&1 || echo "timeout NOT found in PATH"
          type timeout 2>&1 || echo "timeout NOT a shell builtin"
          echo ""
          echo "=== codesign check ==="
          codesign -dv --verbose=4 "$QE_BIN_DIR/pw.x" 2>&1 || true
          echo ""
          echo "=== spctl assessment ==="
          spctl --assess --verbose=4 "$QE_BIN_DIR/pw.x" 2>&1 || true

      - name: Attempt 1 — Direct execution (no timeout, no clearing)
        continue-on-error: true
        run: |
          echo "=== Attempt 1: Direct execution ==="
          "$QE_BIN_DIR/pw.x" < /dev/null 2>&1 | head -10 || true
          echo "Exit code: $?"

      - name: Attempt 2 — After clearing quarantine
        continue-on-error: true
        run: |
          echo "=== Clearing quarantine ==="
          xattr -cr "$RUNNER_TEMP/qe-bundle" 2>/dev/null || true
          xattr "$QE_BIN_DIR/pw.x" 2>&1 || echo "(no attributes)"
          echo ""
          echo "=== Attempt 2: After xattr -cr ==="
          "$QE_BIN_DIR/pw.x" < /dev/null 2>&1 | head -10 || true
          echo "Exit code: $?"

      - name: Attempt 3 — After chmod +x
        continue-on-error: true
        run: |
          chmod +x "$QE_BIN_DIR"/*
          echo "=== Attempt 3: After chmod +x ==="
          "$QE_BIN_DIR/pw.x" < /dev/null 2>&1 | head -10 || true
          echo "Exit code: $?"

      - name: Attempt 4 — Capture output into variable
        continue-on-error: true
        run: |
          echo "=== Attempt 4: Capture into variable ==="
          QE_BANNER=$("$QE_BIN_DIR/pw.x" < /dev/null 2>&1) || true
          echo "Captured output:"
          echo "$QE_BANNER" | head -20
          echo ""
          if echo "$QE_BANNER" | grep -qi "quantum espresso"; then
            echo "RESULT: MATCH — 'quantum espresso' found in output"
          else
            echo "RESULT: NO MATCH — 'quantum espresso' NOT found"
          fi

      - name: Attempt 5 — Original pipeline with set +o pipefail
        continue-on-error: true
        run: |
          echo "=== Attempt 5: Original but without pipefail ==="
          set +o pipefail
          if "$QE_BIN_DIR/pw.x" < /dev/null 2>&1 | grep -qi "quantum espresso"; then
            echo "RESULT: MATCH"
            "$QE_BIN_DIR/pw.x" < /dev/null 2>&1 | head -3 || true
          else
            echo "RESULT: NO MATCH"
          fi
          set -o pipefail

      - name: Summary — Proposed fix for release workflow
        run: |
          echo "=== Proposed verification (the fix) ==="
          # Clear quarantine + chmod
          xattr -cr "$RUNNER_TEMP/qe-bundle" 2>/dev/null || true
          chmod +x "$QE_BIN_DIR"/*

          # Capture output from brief run (pw.x with empty stdin exits immediately)
          QE_BANNER=$("$QE_BIN_DIR/pw.x" < /dev/null 2>&1) || true

          if echo "$QE_BANNER" | grep -qi "quantum espresso"; then
            echo "✅ QE binary verified successfully"
            echo "$QE_BANNER" | head -3
          else
            echo "::error::QE binary verification FAILED"
            echo "--- Output ---"
            echo "$QE_BANNER" | head -20
            echo "--- File type ---"
            file "$QE_BIN_DIR/pw.x"
            echo "--- Dynamic libs ---"
            otool -L "$QE_BIN_DIR/pw.x" 2>&1 | head -20 || true
            exit 1
          fi

          # Test resolving QE_BUNDLE_DIR to absolute path
          QE_BUNDLE_DIR=$(cd "$QE_BIN_DIR/.." && pwd)
          echo "QE_BUNDLE_DIR=$QE_BUNDLE_DIR"
          echo "Contents of QE_BUNDLE_DIR:"
          ls "$QE_BUNDLE_DIR/"

  verify-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Download QE binary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          QE_RELEASE_TAG="qe-7.5-win-oneapi-msmpi-20251223-d409e9b"
          QE_ASSET="qe-7.5-win-oneapi-msmpi.zip"

          echo "=== Downloading ${QE_RELEASE_TAG} ==="
          gh release download "${QE_RELEASE_TAG}" \
            --repo QMatSuite/qmatsuite-toolchain \
            --pattern "${QE_ASSET}" \
            --dir "$RUNNER_TEMP"
          ls -la "$RUNNER_TEMP/${QE_ASSET}"

      - name: Extract and inspect
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/qe-bundle"
          unzip -q "$RUNNER_TEMP/qe-7.5-win-oneapi-msmpi.zip" -d "$RUNNER_TEMP/qe-bundle"

          echo "=== RUNNER_TEMP value ==="
          echo "RUNNER_TEMP=$RUNNER_TEMP"

          echo ""
          echo "=== Full directory tree ==="
          find "$RUNNER_TEMP/qe-bundle" -type f | sort | head -30

          echo ""
          echo "=== Looking for pw.exe ==="
          echo "--- Method 1: find + head + xargs dirname (original) ---"
          RESULT1=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.exe" -type f | head -1 | xargs dirname) || true
          echo "Result: '$RESULT1'"

          echo ""
          echo "--- Method 2: find + dirname (proposed fix) ---"
          QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.exe" -type f | head -1)
          echo "pw.exe path: '$QE_PW_PATH'"
          if [[ -n "$QE_PW_PATH" ]]; then
            QE_BIN_DIR=$(dirname "$QE_PW_PATH")
            echo "dirname result: '$QE_BIN_DIR'"
          fi

          echo ""
          echo "--- Method 3: cd + pwd (safest) ---"
          if [[ -n "$QE_PW_PATH" ]]; then
            QE_BIN_DIR_ABS=$(cd "$(dirname "$QE_PW_PATH")" && pwd)
            echo "Absolute: '$QE_BIN_DIR_ABS'"
          fi

          echo ""
          echo "=== Testing ls on each result ==="
          echo "Method 1:"
          ls "$RESULT1/" 2>&1 | head -5 || echo "FAILED"
          echo ""
          echo "Method 2:"
          ls "$QE_BIN_DIR/" 2>&1 | head -5 || echo "FAILED"
          echo ""
          echo "Method 3:"
          ls "$QE_BIN_DIR_ABS/" 2>&1 | head -5 || echo "FAILED"

          # Export the working one
          echo "QE_BIN_DIR=$QE_BIN_DIR_ABS" >> "$GITHUB_ENV"

      - name: Test QE_BUNDLE_DIR resolution
        run: |
          echo "=== QE_BIN_DIR from env ==="
          echo "QE_BIN_DIR=$QE_BIN_DIR"

          echo ""
          echo "=== Resolve parent (QE_BUNDLE_DIR) ==="

          echo "--- Method A: \$QE_BIN_DIR/.. ---"
          echo "Value: $QE_BIN_DIR/.."
          ls "$QE_BIN_DIR/.." 2>&1 | head -5 || echo "FAILED"

          echo ""
          echo "--- Method B: cd + pwd ---"
          QE_BUNDLE_DIR=$(cd "$QE_BIN_DIR/.." && pwd)
          echo "Value: $QE_BUNDLE_DIR"
          ls "$QE_BUNDLE_DIR/" 2>&1 | head -5 || echo "FAILED"

          echo ""
          echo "=== Proposed env export ==="
          echo "QE_BUNDLE_DIR=$QE_BUNDLE_DIR"

      - name: Summary — Proposed Windows fix
        run: |
          echo "=== Proposed Windows verification ==="

          # Find pw.exe and resolve to absolute path
          QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.exe" -type f | head -1)
          if [[ -z "$QE_PW_PATH" ]]; then
            QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.x" -type f | head -1)
          fi
          if [[ -z "$QE_PW_PATH" ]]; then
            echo "::error::pw.exe/pw.x not found in QE archive"
            find "$RUNNER_TEMP/qe-bundle" -type f | head -20
            exit 1
          fi

          QE_BIN_DIR=$(cd "$(dirname "$QE_PW_PATH")" && pwd)
          echo "QE bin directory: $QE_BIN_DIR"
          ls "$QE_BIN_DIR/" | head -10

          QE_BUNDLE_DIR=$(cd "$QE_BIN_DIR/.." && pwd)
          echo "QE_BUNDLE_DIR=$QE_BUNDLE_DIR"
          echo "Contents:"
          ls "$QE_BUNDLE_DIR/"

          echo ""
          echo "✅ Windows path resolution works"
