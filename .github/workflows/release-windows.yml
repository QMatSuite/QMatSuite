name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 1.0.2 or local)"
        required: true
        type: string
        default: "local"
      sign:
        description: "Sign executables with Microsoft Trusted Signing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ENV_PREFIX: ${{ github.workspace }}/runtime-env
      RUNTIME_PLATFORM: windows-x64
      RUNTIME_ARCHIVE: ${{ github.workspace }}/runtime-windows-x64.tar.zst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache zstd win64
        uses: actions/cache@v4
        with:
          path: .cache/zstd/v1.5.7
          key: zstd-win64-v1.5.7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
          cache-environment: false

      - name: Build runtime environment
        run: |
          set -euo pipefail
          micromamba create -y -p "$RUNTIME_ENV_PREFIX" -c conda-forge python=3.12 pip
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install --upgrade pip
          if [[ "${{ inputs.version }}" == "local" ]]; then
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "${{ github.workspace }}"
          else
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "qmatsuite==${{ inputs.version }}"
          fi
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "import qmatsuite, importlib.metadata as m; print('qmatsuite:', m.version('qmatsuite'))"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.daemon.server import main; print('daemon OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.mcp.server import create_server; print('MCP OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" qms --help > /tmp/qms_help.txt
          head -n 5 /tmp/qms_help.txt

      - name: Stage official zstd (GitHub release) for bundling
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zstdVersion   = "1.5.7"
          $zstdCacheDir  = ".cache/zstd/$zstdVersion"
          $zstdZipName   = "zstd-v$zstdVersion-win64.zip"
          $zstdUrl       = "https://github.com/facebook/zstd/releases/download/v$zstdVersion/$zstdZipName"

          Write-Host "Using zstd version $zstdVersion"
          New-Item -ItemType Directory -Force -Path $zstdCacheDir | Out-Null

          $zipPath = Join-Path $zstdCacheDir $zstdZipName
          $zstdExePath = Join-Path $zstdCacheDir "zstd.exe"
          $libzstdDllPath = Join-Path $zstdCacheDir "dll\libzstd.dll"

          if (-not (Test-Path $zstdExePath) -or -not (Test-Path $libzstdDllPath)) {
            Write-Host "zstd not found in cache; downloading from $zstdUrl"
            Invoke-WebRequest -Uri $zstdUrl -OutFile $zipPath
            Write-Host "Expanding archive $zipPath to $zstdCacheDir"
            Expand-Archive -Force $zipPath $zstdCacheDir
          } else {
            Write-Host "Using cached zstd from $zstdCacheDir"
          }

          if (-not (Test-Path $zstdExePath)) {
            Write-Error "zstd.exe not found at expected path: $zstdExePath"
            exit 1
          }
          if (-not (Test-Path $libzstdDllPath)) {
            Write-Error "libzstd.dll not found at expected path: $libzstdDllPath"
            exit 1
          }

          $stageDir = "gui\extra\bin\windows-x64"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item -Force $zstdExePath    (Join-Path $stageDir "zstd.exe")
          Copy-Item -Force $libzstdDllPath (Join-Path $stageDir "libzstd.dll")

          Write-Host "Staged zstd files:"
          Get-ChildItem $stageDir | Format-Table -AutoSize

          # Fast-fail sanity check
          & (Join-Path $stageDir "zstd.exe") -V
          $code = $LASTEXITCODE
          Write-Host ("zstd -V exit code: " + $code)
          if ($code -ne 0) {
            Write-Error ("zstd -V failed with exit code " + $code)
            exit $code
          }

      - name: Install archive helper dependency
        run: |
          python -m pip install --upgrade pip zstandard

      - name: Build runtime archive
        run: |
          python scripts/build_runtime_archive.py
          ls -lh "$RUNTIME_ARCHIVE"

      - name: Stage runtime archive for electron-builder
        run: |
          cp "$RUNTIME_ARCHIVE" "${{ github.workspace }}/gui/runtime.tar.zst"
          ls -lh "${{ github.workspace }}/gui/runtime.tar.zst"

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI assets
        working-directory: gui
        run: npm run build:e2e

      - name: Clean previous release outputs
        run: |
          rm -rf "${{ github.workspace }}/gui/release"

      - name: Build NSIS installer
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --config electron-builder.json5 --publish never

      - name: Azure Login (OIDC)
        if: ${{ inputs.sign }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Debug Trusted Signing inputs (safe)
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          "ENDPOINT = '${{ vars.TRUSTEDSIGN_ENDPOINT }}'"
          "ACCOUNT  = '${{ vars.TRUSTEDSIGN_ACCOUNT }}'"
          "PROFILE  = '${{ vars.TRUSTEDSIGN_CERT_PROFILE }}'"

      - name: Sign Windows artifacts (Trusted Signing)
        if: ${{ inputs.sign }}
        continue-on-error: false
        uses: Azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.TRUSTEDSIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTEDSIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTEDSIGN_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\\gui\\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          

      - name: Print output artifacts
        run: |
          find "${{ github.workspace }}/gui/release" -maxdepth 4 -type f \( -name "*.exe" -o -name "latest.yml" -o -name "*.blockmap" \) -print
          du -sh "${{ github.workspace }}/gui/release" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qms-windows-release
          path: |
            gui/release/**/*.exe
            gui/release/**/latest.yml
            gui/release/**/*.blockmap
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: ${{ inputs.version != 'local' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            gui/release/**/*.exe
            gui/release/**/latest.yml
            gui/release/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
