name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 1.0.2 or local)"
        required: true
        type: string
        default: "local"
      sign:
        description: "Sign executables with Microsoft Trusted Signing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ENV_PREFIX: ${{ github.workspace }}/runtime-env
      RUNTIME_PLATFORM: windows-x64
      RUNTIME_ARCHIVE: ${{ github.workspace }}/runtime-windows-x64.tar.zst
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache zstd win64
        uses: actions/cache@v4
        with:
          path: .cache/zstd/1.5.7
          key: zstd-win64-v1.5.7

      - name: Prepare zstd win64 (cache + tmp) and fail-fast verify
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Version = "1.5.7"
          $Url = "https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-v1.5.7-win64.zip"
          $CacheDir = Join-Path "${{ github.workspace }}" ".cache\zstd\1.5.7"
          $ZipPath = Join-Path $CacheDir "zstd-v1.5.7-win64.zip"
          $TmpDir = Join-Path "${{ github.workspace }}" ".tmp\zstd-win64"

          Write-Host "Preparing zstd version $Version"
          New-Item -ItemType Directory -Force -Path $CacheDir | Out-Null
          New-Item -ItemType Directory -Force -Path $TmpDir | Out-Null

          # Check if already extracted
          $existingExe = Get-ChildItem -Path $CacheDir -Recurse -Filter "zstd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $existingExe) {
            Write-Host "zstd not found in cache; downloading from $Url"
            Invoke-WebRequest -Uri $Url -OutFile $ZipPath
            Write-Host "Expanding archive $ZipPath to $CacheDir"
            Expand-Archive -Force $ZipPath $CacheDir
          } else {
            Write-Host "Using cached zstd from $CacheDir"
          }

          # Locate files robustly (no hardcoded subdir)
          $zstdExe = Get-ChildItem -Path $CacheDir -Recurse -Filter "zstd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $libDll = Get-ChildItem -Path $CacheDir -Recurse -Filter "libzstd.dll" -ErrorAction SilentlyContinue | Select-Object -First 1

          if (-not $zstdExe) {
            Write-Host "Cache directory contents:"
            Get-ChildItem $CacheDir -Recurse -Depth 3 | Select-Object FullName | Format-Table -AutoSize
            Write-Error "zstd.exe not found in cache directory: $CacheDir"
            exit 1
          }
          if (-not $libDll) {
            Write-Host "Cache directory contents:"
            Get-ChildItem $CacheDir -Recurse -Depth 3 | Select-Object FullName | Format-Table -AutoSize
            Write-Error "libzstd.dll not found in cache directory: $CacheDir"
            exit 1
          }

          # Copy both into tmp dir
          Copy-Item -Force $zstdExe.FullName (Join-Path $TmpDir "zstd.exe")
          Copy-Item -Force $libDll.FullName (Join-Path $TmpDir "libzstd.dll")

          # Remember tmp path for later steps
          Add-Content $env:GITHUB_ENV ("TMP_ZSTD_DIR=" + $TmpDir)

          # FAIL-FAST runtime check FROM TMP DIR
          Push-Location $TmpDir
          & (Join-Path $TmpDir "zstd.exe") -V
          if ($LASTEXITCODE -ne 0) {
            Write-Error ("zstd -V failed with exit code " + $LASTEXITCODE)
            Pop-Location
            exit $LASTEXITCODE
          }
          Pop-Location

          Write-Host "zstd prepared successfully in tmp directory:"
          Get-ChildItem $TmpDir | Format-Table -AutoSize

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
          cache-environment: false

      - name: Build runtime environment
        run: |
          set -euo pipefail
          micromamba create -y -p "$RUNTIME_ENV_PREFIX" -c conda-forge python=3.12 pip
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install --upgrade pip
          if [[ "${{ inputs.version }}" == "local" ]]; then
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "${{ github.workspace }}"
          else
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "qmatsuite==${{ inputs.version }}"
          fi
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "import qmatsuite, importlib.metadata as m; print('qmatsuite:', m.version('qmatsuite'))"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.daemon.server import main; print('daemon OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.mcp.server import create_server; print('MCP OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" qms --help > /tmp/qms_help.txt
          head -n 5 /tmp/qms_help.txt

      - name: Install archive helper dependency
        run: |
          python -m pip install --upgrade pip zstandard

      - name: Build runtime archive
        run: |
          python scripts/build_runtime_archive.py
          ls -lh "$RUNTIME_ARCHIVE"

      - name: Stage runtime archive for electron-builder
        run: |
          cp "$RUNTIME_ARCHIVE" "${{ github.workspace }}/gui/runtime.tar.zst"
          ls -lh "${{ github.workspace }}/gui/runtime.tar.zst"

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI assets
        working-directory: gui
        run: npm run build:e2e

      - name: Clean previous release outputs
        run: |
          rm -rf "${{ github.workspace }}/gui/release"

      - name: Stage zstd from tmp into gui/extra/bin/windows-x64
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TMP_ZSTD_DIR) {
            Write-Error "TMP_ZSTD_DIR not set"
            exit 1
          }

          $stageDir = "gui\extra\bin\windows-x64"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null

          Copy-Item -Force (Join-Path $env:TMP_ZSTD_DIR "zstd.exe") (Join-Path $stageDir "zstd.exe")
          Copy-Item -Force (Join-Path $env:TMP_ZSTD_DIR "libzstd.dll") (Join-Path $stageDir "libzstd.dll")

          Write-Host "Staged zstd files:"
          Get-ChildItem $stageDir | Format-Table -AutoSize

          # Quick confirm
          & (Join-Path $stageDir "zstd.exe") -V
          if ($LASTEXITCODE -ne 0) {
            Write-Error ("staged zstd -V failed with exit code " + $LASTEXITCODE)
            exit $LASTEXITCODE
          }

      - name: Build NSIS installer
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --config electron-builder.json5 --publish never

      - name: Azure Login (OIDC)
        if: ${{ inputs.sign }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Debug Trusted Signing inputs (safe)
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          "ENDPOINT = '${{ vars.TRUSTEDSIGN_ENDPOINT }}'"
          "ACCOUNT  = '${{ vars.TRUSTEDSIGN_ACCOUNT }}'"
          "PROFILE  = '${{ vars.TRUSTEDSIGN_CERT_PROFILE }}'"

      - name: Sign Windows artifacts (Trusted Signing)
        if: ${{ inputs.sign }}
        continue-on-error: false
        uses: Azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.TRUSTEDSIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTEDSIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTEDSIGN_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\\gui\\release
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          

      - name: Print output artifacts
        run: |
          find "${{ github.workspace }}/gui/release" -maxdepth 4 -type f \( -name "*.exe" -o -name "latest.yml" -o -name "*.blockmap" \) -print
          du -sh "${{ github.workspace }}/gui/release" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qms-windows-release
          path: |
            gui/release/**/*.exe
            gui/release/**/latest.yml
            gui/release/**/*.blockmap
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: ${{ inputs.version != 'local' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            gui/release/**/*.exe
            gui/release/**/latest.yml
            gui/release/**/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
