name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 1.0.2 or local)"
        required: true
        type: string
        default: "local"
      sign:
        description: "Sign executables with Microsoft Trusted Signing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ENV_PREFIX: ${{ github.workspace }}/runtime-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
          cache-environment: false

      - name: Build runtime environment
        run: |
          set -euo pipefail
          micromamba create -y -p "$RUNTIME_ENV_PREFIX" -c conda-forge python=3.12 pip
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install --upgrade pip
          if [[ "${{ inputs.version }}" == "local" ]]; then
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "${{ github.workspace }}"
          else
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "qmatsuite==${{ inputs.version }}"
          fi
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "import qmatsuite, importlib.metadata as m; print('qmatsuite:', m.version('qmatsuite'))"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.daemon.server import main; print('daemon OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.mcp.server import create_server; print('MCP OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" qms --help > /tmp/qms_help.txt
          head -n 5 /tmp/qms_help.txt

      - name: Build relocatable runtime with conda-pack
        run: |
          set -euo pipefail
          pip install conda-pack
          conda-pack -p "$RUNTIME_ENV_PREFIX" -o runtime-packed.tar.gz --force
          mkdir -p gui/runtime
          tar -xzf runtime-packed.tar.gz -C gui/runtime
          # DO NOT run conda-unpack here — it runs on the user's machine
          # (during NSIS install via customInstall macro, or on first launch)
          rm -f runtime-packed.tar.gz

          # Strip bulky non-essential files to reduce count and installer size
          cd gui/runtime
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name tests -path '*/site-packages/*/tests' -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name test -path '*/site-packages/*/test' -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.pyc' -delete 2>/dev/null || true
          find . -type f -name '*.pyo' -delete 2>/dev/null || true
          find . -type f -name '*.a' -delete 2>/dev/null || true
          rm -rf share/man share/doc share/gtk-doc share/info 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"

          echo "=== Runtime size after strip ==="
          du -sh gui/runtime
          echo "=== File count ==="
          find gui/runtime -type f | wc -l

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI assets
        working-directory: gui
        run: npm run build:e2e

      - name: Clean previous release outputs
        run: |
          rm -rf "${{ github.workspace }}/gui/release"

      - name: Build NSIS installer
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --config electron-builder.json5 --publish never

      - name: Azure Login (OIDC)
        if: ${{ inputs.sign }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Debug Trusted Signing inputs (safe)
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          "ENDPOINT = '${{ vars.TRUSTEDSIGN_ENDPOINT }}'"
          "ACCOUNT  = '${{ vars.TRUSTEDSIGN_ACCOUNT }}'"
          "PROFILE  = '${{ vars.TRUSTEDSIGN_CERT_PROFILE }}'"

      - name: Collect unsigned files for signing
        id: collect_unsigned
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\gui\release"
          $stagingDir = "$env:RUNNER_TEMP\sign-staging"
          $originalsFile = "$env:RUNNER_TEMP\unsigned_originals.txt"

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $originals = @()

          $candidates = Get-ChildItem -Path $releaseDir -Recurse -Include *.exe,*.dll,*.pyd -File
          $totalCount = $candidates.Count
          $signedCount = 0
          $unsignedCount = 0

          foreach ($file in $candidates) {
              $sig = Get-AuthenticodeSignature -FilePath $file.FullName
              if ($sig.Status -eq "Valid") {
                  Write-Host "[SKIP] Already signed: $($file.FullName)"
                  $signedCount++
              } else {
                  # Create a flat filename from the relative path to avoid collisions
                  $relPath = $file.FullName.Substring($releaseDir.Length + 1)
                  $flatName = $relPath -replace '[\\\/]', '_'
                  Copy-Item -Path $file.FullName -Destination (Join-Path $stagingDir $flatName)
                  $originals += "$($file.FullName)|$flatName"
                  Write-Host "[SIGN] Unsigned: $($file.FullName) -> $flatName"
                  $unsignedCount++
              }
          }

          Write-Host ""
          Write-Host "=== Signing Summary ==="
          Write-Host "Total candidates: $totalCount"
          Write-Host "Already signed (skipped): $signedCount"
          Write-Host "Unsigned (will sign): $unsignedCount"

          if ($unsignedCount -gt 0) {
              $originals | Out-File -FilePath $originalsFile -Encoding utf8
              "has_unsigned=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "has_unsigned=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          # Export staging dir for the signing step
          "SIGN_STAGING_DIR=$stagingDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign unsigned artifacts (Trusted Signing)
        if: ${{ inputs.sign && steps.collect_unsigned.outputs.has_unsigned == 'true' }}
        continue-on-error: false
        uses: Azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.TRUSTEDSIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTEDSIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTEDSIGN_CERT_PROFILE }}
          files-folder: ${{ env.SIGN_STAGING_DIR }}
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copy signed files back to release dir
        if: ${{ inputs.sign && steps.collect_unsigned.outputs.has_unsigned == 'true' }}
        shell: pwsh
        run: |
          $originalsFile = "$env:RUNNER_TEMP\unsigned_originals.txt"
          $stagingDir = $env:SIGN_STAGING_DIR

          $lines = Get-Content -Path $originalsFile
          $copiedCount = 0
          foreach ($line in $lines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line.Split('|', 2)
              $originalPath = $parts[0]
              $flatName = $parts[1]
              $signedFile = Join-Path $stagingDir $flatName
              if (Test-Path $signedFile) {
                  Copy-Item -Path $signedFile -Destination $originalPath -Force
                  Write-Host "[RESTORED] $flatName -> $originalPath"
                  $copiedCount++
              } else {
                  Write-Host "::warning::Signed file not found in staging: $flatName"
              }
          }
          Write-Host ""
          Write-Host "Restored $copiedCount signed files to release directory."

      - name: Print output artifacts
        run: |
          find "${{ github.workspace }}/gui/release" -maxdepth 4 -type f \( -name "*.exe" -o -name "latest.yml" -o -name "*.blockmap" \) -print
          du -sh "${{ github.workspace }}/gui/release" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qms-windows-release
          path: |
            gui/release/QMatSuite-*.exe
            gui/release/latest.yml
            gui/release/QMatSuite-*.exe.blockmap
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: ${{ inputs.version != 'local' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            gui/release/QMatSuite-*.exe
            gui/release/latest.yml
            gui/release/QMatSuite-*.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
