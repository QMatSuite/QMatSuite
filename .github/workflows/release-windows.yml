name: Release Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (e.g., 1.0.2 or local)"
        required: true
        type: string
        default: "local"
      variant:
        description: "Which variants to build"
        required: true
        type: choice
        options:
          - both
          - lite
          - full
        default: "both"
      sign:
        description: "Sign executables with Microsoft Trusted Signing"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUNTIME_ENV_PREFIX: ${{ github.workspace }}/runtime-env
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build flags
        id: flags
        run: |
          variant="${{ inputs.variant }}"
          if [[ "$variant" == "full" || "$variant" == "both" ]]; then
            echo "build_full=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_full=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$variant" == "lite" || "$variant" == "both" ]]; then
            echo "build_lite=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_lite=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Fail-fast: download QE + SSSP before expensive runtime build ──

      - name: Download QE binary from toolchain release
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          QE_RELEASE_TAG="qe-7.5-win-oneapi-msmpi-20251223-d409e9b"
          QE_ASSET="qe-7.5-win-oneapi-msmpi.zip"

          echo "Downloading QE binary from toolchain release: ${QE_RELEASE_TAG}..."
          gh release download "${QE_RELEASE_TAG}" \
            --repo QMatSuite/qmatsuite-toolchain \
            --pattern "${QE_ASSET}" \
            --dir "$RUNNER_TEMP"

          echo "Extracting QE binary..."
          mkdir -p "$RUNNER_TEMP/qe-bundle"
          unzip -q "$RUNNER_TEMP/${QE_ASSET}" -d "$RUNNER_TEMP/qe-bundle"

          echo "Verifying QE binary..."
          QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.exe" -type f | head -1)
          if [[ -z "$QE_PW_PATH" ]]; then
            QE_PW_PATH=$(find "$RUNNER_TEMP/qe-bundle" -name "pw.x" -type f | head -1)
          fi
          if [[ -z "$QE_PW_PATH" ]]; then
            echo "::error::pw.exe/pw.x not found in QE archive"
            find "$RUNNER_TEMP/qe-bundle" -type f | head -20
            exit 1
          fi

          # Resolve to absolute POSIX path (avoids Windows path mangling with xargs)
          QE_BIN_DIR=$(cd "$(dirname "$QE_PW_PATH")" && pwd)
          echo "QE bin directory: $QE_BIN_DIR"
          ls "$QE_BIN_DIR/" | head -10

          # QE_BUNDLE_DIR = absolute path to the directory containing bin/
          QE_BUNDLE_DIR=$(cd "$QE_BIN_DIR/.." && pwd)
          echo "QE_BUNDLE_DIR=$QE_BUNDLE_DIR" >> "$GITHUB_ENV"

      - name: Download SSSP from qmatsuite-assets
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SSSP_TAG="assets-2025-12-26"
          SSSP_TARBALL="SSSP_1.3.0_PBE_efficiency.tar.gz"
          SSSP_JSON="SSSP_1.3.0_PBE_efficiency.json"
          SSSP_TARBALL_SHA256="7a85b71fa3d68df1b5ed33c55c7057681fbf10377ae3b3eac9392924d9189f12"
          SSSP_JSON_SHA256="2c8642a70308ecd072a209a30c160bf51423560bb202116cb31fd5275eff814a"

          echo "Downloading SSSP from qmatsuite-assets..."
          gh release download "${SSSP_TAG}" \
            --repo QMatSuite/qmatsuite-assets \
            --pattern "${SSSP_TARBALL}" \
            --pattern "${SSSP_JSON}" \
            --dir "$RUNNER_TEMP"

          echo "Verifying SHA256..."
          echo "${SSSP_TARBALL_SHA256}  $RUNNER_TEMP/${SSSP_TARBALL}" | sha256sum -c -
          echo "${SSSP_JSON_SHA256}  $RUNNER_TEMP/${SSSP_JSON}" | sha256sum -c -

          echo "Extracting SSSP into three-level layout: SSSP/efficiency/1.3.0..."
          # Convert Windows paths to POSIX (tar interprets D: as remote host)
          TEMP_POSIX=$(cd "$RUNNER_TEMP" && pwd)
          SSSP_INSTALL_DIR="$TEMP_POSIX/sssp-bundle/SSSP/efficiency/1.3.0"
          mkdir -p "$SSSP_INSTALL_DIR"
          tar -xzf "$TEMP_POSIX/${SSSP_TARBALL}" -C "$SSSP_INSTALL_DIR"
          cp "$TEMP_POSIX/${SSSP_JSON}" "$SSSP_INSTALL_DIR/"

          # Write head.json (required by pseudo library three-level walk)
          printf '%s\n' '{"library_key":"sssp","dir_name":"SSSP","variant":"efficiency","version":"1.3.0","source_archive":"SSSP_1.3.0_PBE_efficiency.tar.gz","sha256":"7a85b71fa3d68df1b5ed33c55c7057681fbf10377ae3b3eac9392924d9189f12"}' > "$SSSP_INSTALL_DIR/head.json"

          echo "SSSP_BUNDLE_DIR=$TEMP_POSIX/sssp-bundle" >> "$GITHUB_ENV"
          echo "✅ SSSP verified and extracted"

      # ── Standard build steps ──

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          init-shell: bash
          cache-downloads: true
          cache-environment: false

      - name: Build runtime environment
        run: |
          set -euo pipefail
          micromamba create -y -p "$RUNTIME_ENV_PREFIX" -c conda-forge python=3.12 pip
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install --upgrade pip
          if [[ "${{ inputs.version }}" == "local" ]]; then
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "${{ github.workspace }}"
          else
            micromamba run -p "$RUNTIME_ENV_PREFIX" python -m pip install "qmatsuite==${{ inputs.version }}"
          fi
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "import qmatsuite, importlib.metadata as m; print('qmatsuite:', m.version('qmatsuite'))"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.daemon.server import main; print('daemon OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" python -c "from qmatsuite.mcp.server import create_server; print('MCP OK')"
          micromamba run -p "$RUNTIME_ENV_PREFIX" qms --help > /tmp/qms_help.txt
          head -n 5 /tmp/qms_help.txt

      - name: Build relocatable runtime with conda-pack
        run: |
          set -euo pipefail
          pip install conda-pack
          conda-pack -p "$RUNTIME_ENV_PREFIX" -o runtime-packed.tar.gz --force
          mkdir -p gui/runtime
          tar -xzf runtime-packed.tar.gz -C gui/runtime
          # DO NOT run conda-unpack here — it runs on the user's machine
          # (during NSIS install via customInstall macro)
          rm -f runtime-packed.tar.gz

          # Strip bulky non-essential files to reduce count and installer size
          cd gui/runtime
          find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name tests -path '*/site-packages/*/tests' -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name test -path '*/site-packages/*/test' -exec rm -rf {} + 2>/dev/null || true
          find . -type f -name '*.pyc' -delete 2>/dev/null || true
          find . -type f -name '*.pyo' -delete 2>/dev/null || true
          find . -type f -name '*.a' -delete 2>/dev/null || true
          rm -rf share/man share/doc share/gtk-doc share/info 2>/dev/null || true

          # C/C++ headers — only needed for compiling extensions, never at runtime
          rm -rf include 2>/dev/null || true

          # Conda package metadata — only used by conda package manager
          rm -rf conda-meta 2>/dev/null || true

          # Build tools in share/ — cmake modules can be ~4000 files alone
          rm -rf share/cmake* share/aclocal share/gir-1.0 2>/dev/null || true

          # Stdlib test suite — never needed at runtime
          rm -rf lib/python*/test 2>/dev/null || true

          # Stdlib modules not needed for headless daemon
          rm -rf lib/python*/ensurepip lib/python*/turtledemo lib/python*/pydoc_data 2>/dev/null || true

          # Type stubs and markers — only used by type checkers, not at runtime
          find . -type f -name '*.pyi' -delete 2>/dev/null || true
          find . -type f -name 'py.typed' -delete 2>/dev/null || true

          # Remove empty directories left by stripping
          find . -type d -empty -delete 2>/dev/null || true
          cd "$GITHUB_WORKSPACE"

          echo "=== Runtime size after strip ==="
          du -sh gui/runtime
          echo "=== File count ==="
          find gui/runtime -type f | wc -l

      - name: Install GUI dependencies
        working-directory: gui
        run: npm ci

      - name: Build GUI assets
        working-directory: gui
        run: npm run build:e2e

      # ── Prepare holding directory for installers ──

      - name: Create installer holding directory
        run: mkdir -p "$RUNNER_TEMP/exe-hold"

      # ── Build lite NSIS installer ──

      - name: Clean release outputs (lite)
        if: ${{ steps.flags.outputs.build_lite == 'true' }}
        run: rm -rf "${{ github.workspace }}/gui/release"

      - name: Ensure no extra engines/libraries staged (lite)
        if: ${{ steps.flags.outputs.build_lite == 'true' }}
        run: |
          rm -rf "${{ github.workspace }}/gui/engines"
          rm -rf "${{ github.workspace }}/gui/libraries"

      - name: Build lite NSIS installer
        if: ${{ steps.flags.outputs.build_lite == 'true' }}
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --config electron-builder.json5 --publish never

      - name: Rename and hold lite installer
        if: ${{ steps.flags.outputs.build_lite == 'true' }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/gui/release"
          # electron-builder produces: QMatSuite-Windows-{version}.exe
          # Lite keeps the default name (no rename needed)
          mv QMatSuite-*.exe QMatSuite-*.exe.blockmap latest.yml "$RUNNER_TEMP/exe-hold/" 2>/dev/null || true
          echo "Lite installer moved to holding directory"
          ls -la "$RUNNER_TEMP/exe-hold/"

      # ── Build full NSIS installer ──

      - name: Stage QE + SSSP for full build
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        run: |
          set -euo pipefail
          echo "Staging QE binary into gui/engines/..."
          mkdir -p "${{ github.workspace }}/gui/engines/qe/bundled-7.5"
          cp -R "$QE_BUNDLE_DIR"/. "${{ github.workspace }}/gui/engines/qe/bundled-7.5/"
          echo "QE staged:"
          ls "${{ github.workspace }}/gui/engines/qe/bundled-7.5/bin/" | head -5
          du -sh "${{ github.workspace }}/gui/engines/qe/bundled-7.5"

          echo "Staging SSSP into gui/libraries/pseudo/ (three-level layout)..."
          mkdir -p "${{ github.workspace }}/gui/libraries/pseudo"
          cp -R "$SSSP_BUNDLE_DIR"/. "${{ github.workspace }}/gui/libraries/pseudo/"
          echo "SSSP staged:"
          ls "${{ github.workspace }}/gui/libraries/pseudo/SSSP/efficiency/1.3.0/" | head -5
          du -sh "${{ github.workspace }}/gui/libraries/pseudo"

      - name: Clean release outputs (full)
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        run: rm -rf "${{ github.workspace }}/gui/release"

      - name: Build full NSIS installer
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        working-directory: gui
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --config electron-builder.json5 --publish never

      - name: Rename and hold full installer
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/gui/release"
          # Rename: QMatSuite-Windows-{version}.exe -> QMatSuite-Full-Windows-{version}.exe
          for f in QMatSuite-Windows-*.exe; do
            new_name="${f/QMatSuite-Windows-/QMatSuite-Full-Windows-}"
            mv "$f" "$new_name"
            echo "Renamed $f -> $new_name"
          done
          for f in QMatSuite-Windows-*.exe.blockmap; do
            new_name="${f/QMatSuite-Windows-/QMatSuite-Full-Windows-}"
            mv "$f" "$new_name"
          done
          mv QMatSuite-*.exe QMatSuite-*.exe.blockmap "$RUNNER_TEMP/exe-hold/" 2>/dev/null || true
          # latest.yml already held from lite build (or copy if full-only)
          mv latest.yml "$RUNNER_TEMP/exe-hold/" 2>/dev/null || true
          echo "Full installer moved to holding directory"
          ls -la "$RUNNER_TEMP/exe-hold/"

      - name: Remove staged engines/libraries
        if: ${{ steps.flags.outputs.build_full == 'true' }}
        run: |
          rm -rf "${{ github.workspace }}/gui/engines"
          rm -rf "${{ github.workspace }}/gui/libraries"

      # ── Collect all installers back into gui/release/ ──

      - name: Collect installers into release directory
        run: |
          rm -rf "${{ github.workspace }}/gui/release"
          mkdir -p "${{ github.workspace }}/gui/release"
          cp "$RUNNER_TEMP/exe-hold"/* "${{ github.workspace }}/gui/release/" 2>/dev/null || true
          echo "=== Final release directory ==="
          ls -la "${{ github.workspace }}/gui/release/"

      # ── Signing ──

      - name: Azure Login (OIDC)
        if: ${{ inputs.sign }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: false

      - name: Debug Trusted Signing inputs (safe)
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          "ENDPOINT = '${{ vars.TRUSTEDSIGN_ENDPOINT }}'"
          "ACCOUNT  = '${{ vars.TRUSTEDSIGN_ACCOUNT }}'"
          "PROFILE  = '${{ vars.TRUSTEDSIGN_CERT_PROFILE }}'"

      - name: Collect unsigned files for signing
        id: collect_unsigned
        if: ${{ inputs.sign }}
        shell: pwsh
        run: |
          $releaseDir = "${{ github.workspace }}\gui\release"
          $stagingDir = "$env:RUNNER_TEMP\sign-staging"
          $originalsFile = "$env:RUNNER_TEMP\unsigned_originals.txt"

          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null
          $originals = @()

          $candidates = Get-ChildItem -Path $releaseDir -Recurse -Include *.exe,*.dll,*.pyd -File
          $totalCount = $candidates.Count
          $signedCount = 0
          $unsignedCount = 0

          foreach ($file in $candidates) {
              $sig = Get-AuthenticodeSignature -FilePath $file.FullName
              if ($sig.Status -eq "Valid") {
                  Write-Host "[SKIP] Already signed: $($file.FullName)"
                  $signedCount++
              } else {
                  # Create a flat filename from the relative path to avoid collisions
                  $relPath = $file.FullName.Substring($releaseDir.Length + 1)
                  $flatName = $relPath -replace '[\\\/]', '_'
                  Copy-Item -Path $file.FullName -Destination (Join-Path $stagingDir $flatName)
                  $originals += "$($file.FullName)|$flatName"
                  Write-Host "[SIGN] Unsigned: $($file.FullName) -> $flatName"
                  $unsignedCount++
              }
          }

          Write-Host ""
          Write-Host "=== Signing Summary ==="
          Write-Host "Total candidates: $totalCount"
          Write-Host "Already signed (skipped): $signedCount"
          Write-Host "Unsigned (will sign): $unsignedCount"

          if ($unsignedCount -gt 0) {
              $originals | Out-File -FilePath $originalsFile -Encoding utf8
              "has_unsigned=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "has_unsigned=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

          # Export staging dir for the signing step
          "SIGN_STAGING_DIR=$stagingDir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Sign unsigned artifacts (Trusted Signing)
        if: ${{ inputs.sign && steps.collect_unsigned.outputs.has_unsigned == 'true' }}
        continue-on-error: false
        uses: Azure/trusted-signing-action@v0
        with:
          endpoint: ${{ vars.TRUSTEDSIGN_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.TRUSTEDSIGN_ACCOUNT }}
          certificate-profile-name: ${{ vars.TRUSTEDSIGN_CERT_PROFILE }}
          files-folder: ${{ env.SIGN_STAGING_DIR }}
          files-folder-filter: exe,dll,pyd
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Copy signed files back to release dir
        if: ${{ inputs.sign && steps.collect_unsigned.outputs.has_unsigned == 'true' }}
        shell: pwsh
        run: |
          $originalsFile = "$env:RUNNER_TEMP\unsigned_originals.txt"
          $stagingDir = $env:SIGN_STAGING_DIR

          $lines = Get-Content -Path $originalsFile
          $copiedCount = 0
          foreach ($line in $lines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $parts = $line.Split('|', 2)
              $originalPath = $parts[0]
              $flatName = $parts[1]
              $signedFile = Join-Path $stagingDir $flatName
              if (Test-Path $signedFile) {
                  Copy-Item -Path $signedFile -Destination $originalPath -Force
                  Write-Host "[RESTORED] $flatName -> $originalPath"
                  $copiedCount++
              } else {
                  Write-Host "::warning::Signed file not found in staging: $flatName"
              }
          }
          Write-Host ""
          Write-Host "Restored $copiedCount signed files to release directory."

      # ── Upload ──

      - name: Print output artifacts
        run: |
          find "${{ github.workspace }}/gui/release" -maxdepth 4 -type f \( -name "*.exe" -o -name "latest.yml" -o -name "*.blockmap" \) -print
          du -sh "${{ github.workspace }}/gui/release" || true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qms-windows-release
          path: |
            gui/release/QMatSuite-*.exe
            gui/release/latest.yml
            gui/release/QMatSuite-*.exe.blockmap
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        if: ${{ inputs.version != 'local' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          draft: true
          fail_on_unmatched_files: false
          files: |
            gui/release/QMatSuite-*.exe
            gui/release/latest.yml
            gui/release/QMatSuite-*.exe.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
