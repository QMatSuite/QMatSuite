name: Tests

on:
  push:
    # Only run on v2-python branch
    branches: [ v2-python ]
  pull_request:
    # Only run PRs targeting v2-python branch
    branches: [ v2-python ]

jobs:
  tests-with-qe:
    name: Tests with QE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install Quantum ESPRESSO (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install --no-install-recommends -y \
          libfftw3-dev \
          quantum-espresso
        # Find QE installation directory
        # QE executables are typically in /usr/bin
        # QE_HOME might be /usr or /usr/share/quantum-espresso
        if [ -d "/usr/share/quantum-espresso" ]; then
          echo "QE_HOME=/usr/share/quantum-espresso" >> $GITHUB_ENV
        elif [ -f "/usr/bin/pw.x" ]; then
          echo "QE_HOME=/usr" >> $GITHUB_ENV
        else
          echo "QE_HOME=/usr" >> $GITHUB_ENV
        fi
    
    - name: Install system dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install gcc gfortran openmpi fftw wget make
        # Find actual gcc and gfortran paths
        # On macOS, gcc might be in /opt/homebrew/bin or /usr/local/bin
        GCC_PATH=$(which gcc-13 || which gcc-12 || which gcc-11 || which gcc || echo "/usr/bin/gcc")
        GFORTRAN_PATH=$(which gfortran || echo "/usr/bin/gfortran")
        GCC_DIR=$(dirname "$GCC_PATH")
        
        echo "CC=$GCC_PATH" >> $GITHUB_ENV
        echo "FC=$GFORTRAN_PATH" >> $GITHUB_ENV
        echo "PATH=$GCC_DIR:$PATH" >> $GITHUB_ENV
        
        # Verify compilers
        echo "Using CC: $GCC_PATH"
        echo "Using FC: $GFORTRAN_PATH"
        $GCC_PATH --version || true
        $GFORTRAN_PATH --version || true
    
    - name: Install Quantum ESPRESSO (macOS - from source)
      if: matrix.os == 'macos-latest'
      run: |
        # Create QE installation directory
        mkdir -p $HOME/src
        cd $HOME/src
        
        # Download QE 7.5 source
        if [ ! -d "q-e-qe-7.5" ]; then
          wget -q https://gitlab.com/QEF/q-e/-/archive/qe-7.5/q-e-qe-7.5.tar.gz
          tar -xzf q-e-qe-7.5.tar.gz
          rm q-e-qe-7.5.tar.gz
        fi
        
        cd q-e-qe-7.5
        
        # Get brew paths
        FFTW_PREFIX=$(brew --prefix fftw)
        
        # Use environment variables set in previous step
        # CC and FC should already be set in GITHUB_ENV
        
        # Configure QE for macOS
        # Use CC and FC from environment, with fallback
        export CC=${CC:-gcc}
        export FC=${FC:-gfortran}
        
        # Configure QE
        ./configure \
          CC="$CC" \
          FC="$FC" \
          BLAS_LIBS="-framework Accelerate" \
          LAPACK_LIBS="" \
          FFT_LIBS="-L${FFTW_PREFIX}/lib -lfftw3" \
          MPIF90=mpif90 || \
        ./configure \
          BLAS_LIBS="-framework Accelerate" \
          LAPACK_LIBS="" \
          FFT_LIBS="-L${FFTW_PREFIX}/lib -lfftw3" \
          MPIF90=mpif90
        
        # Build QE (essential modules for testing)
        make pw -j2 || make pw
        make ph -j2 || make ph
        make pp -j2 || make pp
        
        # Set QE_HOME environment variable
        echo "QE_HOME=$HOME/src/q-e-qe-7.5" >> $GITHUB_ENV
        echo "$HOME/src/q-e-qe-7.5/bin" >> $GITHUB_PATH
    
    - name: Verify QE installation
      run: |
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          # On Ubuntu, QE is installed via apt
          which pw.x || (echo "pw.x not found in PATH" && exit 1)
          pw.x --version || echo "pw.x version check failed (may be normal)"
          # QE_HOME should already be set from install step
        else
          # On macOS, QE is compiled from source
          QE_HOME=$HOME/src/q-e-qe-7.5
          export QE_HOME
          export PATH="$QE_HOME/bin:$PATH"
          which pw.x || (echo "pw.x not found in PATH" && exit 1)
          pw.x --version || echo "pw.x version check failed (may be normal)"
          ls -la $QE_HOME/bin/pw.x || exit 1
          echo "QE_HOME=$QE_HOME" >> $GITHUB_ENV
        fi
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist
    
    - name: Run all tests in tests/ directory
      run: |
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          # Ubuntu: QE installed via apt, already in PATH
          # QE_HOME should be set from install step
          export QE_HOME=${QE_HOME:-/usr}
        else
          # macOS: QE compiled from source
          export QE_HOME=$HOME/src/q-e-qe-7.5
          export PATH="$QE_HOME/bin:$PATH"
        fi
        pytest tests/ -v --cov=src/quantumvitas --cov-report=xml --cov-report=term
      env:
        QE_HOME: ${{ env.QE_HOME }}
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: tests-qe
        name: codecov-umbrella
        fail_ci_if_error: false

  extended-tests:
    name: Extended Tests (Manual)
    runs-on: ubuntu-latest
    # Only run on manual trigger or schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov
    
    - name: Setup QE (if available)
      run: |
        # This would need to be configured based on your CI setup
        # For now, extended tests will be skipped if QE is not available
        echo "QE setup would go here"
    
    - name: Run extended tests
      run: |
        pytest extended-tests/ -m extended -v --maxfail=10
      continue-on-error: true  # Don't fail CI if extended tests fail
    
    - name: Analyze results
      if: always()
      run: |
        # If results file exists, analyze it
        if [ -f extended_test_results.json ]; then
          python extended-tests/analyze_results.py extended_test_results.json
        fi
