name: Tests

on:
  push:
    # Only run on v2-python branch
    branches: [ v2-python ]
  pull_request:
    # Only run PRs targeting v2-python branch
    branches: [ v2-python ]

jobs:
  tests-with-qe:
    name: Tests with QE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ['3.12']
    
    env:
      QE_VERSION: "qe-7.5"
      QE_SRC_DIR: "$HOME/src/q-e-qe-7.5"
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set QE env vars
      run: |
        if [ "${{ matrix.os }}" = "ubuntu-22.04" ]; then
          echo "QE_BUILD_OPTS=mpi=1 fftw=1 openblas=ubuntu" >> $GITHUB_ENV
        else
          echo "QE_BUILD_OPTS=mpi=1 fftw=1 openblas=mac accel=mac" >> $GITHUB_ENV
        fi
        echo "QE_PREFIX=$HOME/qe-install/${QE_VERSION}/${{ matrix.os }}" >> $GITHUB_ENV
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-22.04'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install --no-install-recommends -y \
          build-essential \
          gfortran \
          libfftw3-dev \
          libopenblas-dev \
          liblapack-dev \
          libscalapack-mpi-dev \
          libfftw3-mpi-dev \
          libhdf5-serial-dev \
          mpich \
          libmpich-dev \
          wget \
          make \
          ccache
    
    - name: Install system dependencies and setup compilers (macOS)
      if: matrix.os == 'macos-14'
      run: |
        brew update
        brew install gcc gfortran openmpi fftw wget make ccache
        
        # Get gcc prefix and detect versioned gcc
        GCC_PREFIX=$(brew --prefix gcc)
        
        # Find all versioned gcc (gcc-15, gcc-16, gcc-17, etc.) and select the highest version
        GCC_VERSIONS=$(ls "$GCC_PREFIX/bin"/gcc-* 2>/dev/null | grep -E 'gcc-[0-9]+$' | sed 's/.*gcc-\([0-9]*\)$/\1/' | sort -rn)
        if [ -n "$GCC_VERSIONS" ]; then
          # Use the highest version found
          HIGHEST_VERSION=$(echo "$GCC_VERSIONS" | head -1)
          echo "CC=$GCC_PREFIX/bin/gcc-$HIGHEST_VERSION" >> $GITHUB_ENV
          # Use matching versioned cpp
          echo "CPP=$GCC_PREFIX/bin/cpp-$HIGHEST_VERSION" >> $GITHUB_ENV
        else
          # Fallback to non-versioned
          echo "CC=$GCC_PREFIX/bin/gcc" >> $GITHUB_ENV
          echo "CPP=$GCC_PREFIX/bin/cpp" >> $GITHUB_ENV
        fi
        
        # Use symbolic link gfortran (if exists), otherwise fallback
        if [ -f "$GCC_PREFIX/bin/gfortran" ]; then
          echo "FC=$GCC_PREFIX/bin/gfortran" >> $GITHUB_ENV
        else
          echo "FC=$(which gfortran)" >> $GITHUB_ENV
        fi
        
        echo "PATH=$GCC_PREFIX/bin:$PATH" >> $GITHUB_ENV
    
    - name: Cache ccache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache-${{ matrix.os }}-${{ env.QE_VERSION }}-v1
        restore-keys: |
          ccache-${{ matrix.os }}-${{ env.QE_VERSION }}-
          ccache-${{ matrix.os }}-
    
    - name: Setup ccache
      run: |
        ccache -M 2G
        if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
          echo "CC=ccache gcc" >> $GITHUB_ENV
          echo "CXX=ccache g++" >> $GITHUB_ENV
          echo "FC=ccache gfortran" >> $GITHUB_ENV
        else
          # macOS: wrap existing compilers with ccache
          if [ -n "$CC" ]; then
            echo "CC=ccache $CC" >> $GITHUB_ENV
          fi
          if [ -n "$FC" ]; then
            echo "FC=ccache $FC" >> $GITHUB_ENV
          fi
        fi
    
    - name: Cache QE source
      uses: actions/cache@v4
      with:
        path: ${{ env.QE_SRC_DIR }}
        key: qe-source-${{ env.QE_VERSION }}-${{ matrix.os }}-v1
        restore-keys: |
          qe-source-${{ env.QE_VERSION }}-${{ matrix.os }}-
          qe-source-${{ env.QE_VERSION }}-
    
    - name: Cache QE install prefix
      id: cache-qe-install
      uses: actions/cache@v4
      with:
        path: ${{ env.QE_PREFIX }}
        key: qe-install-${{ matrix.os }}-${{ env.QE_VERSION }}-${{ env.QE_BUILD_OPTS }}-v1
        restore-keys: |
          qe-install-${{ matrix.os }}-${{ env.QE_VERSION }}-
    
    - name: Install Quantum ESPRESSO (from source)
      if: steps.cache-qe-install.outputs.cache-hit != 'true'
      run: |
        # Create QE installation prefix directory
        mkdir -p ${{ env.QE_PREFIX }}
        
        # Ensure source directory parent exists
        mkdir -p $HOME/src
        
        # Download QE 7.5 source (if not cached or stale)
        # Check for configure file existence as the guard (works even if directory exists but is empty)
        if [ ! -f "${{ env.QE_SRC_DIR }}/configure" ]; then
          # Clean up any stale/empty directory
          rm -rf "${{ env.QE_SRC_DIR }}"
          
          # Download and extract
          cd $HOME/src
          wget -q https://gitlab.com/QEF/q-e/-/archive/qe-7.5/q-e-qe-7.5.tar.gz
          tar -xzf q-e-qe-7.5.tar.gz
          rm q-e-qe-7.5.tar.gz
          
          # Verify extraction succeeded
          if [ ! -f "${{ env.QE_SRC_DIR }}/configure" ]; then
            echo "ERROR: QE source extraction failed - configure file not found"
            exit 1
          fi
        fi
        
        # Use QE_SRC_DIR consistently
        cd "${{ env.QE_SRC_DIR }}"
        
        # Debug: verify source directory before configure
        echo "QE_SRC_DIR=${{ env.QE_SRC_DIR }}"
        ls -la "${{ env.QE_SRC_DIR }}" | head -10
        test -f "${{ env.QE_SRC_DIR }}/configure" || (echo "ERROR: configure file missing" && exit 1)
        
        if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
          # Configure QE for Ubuntu with install prefix
          ./configure \
            --prefix="${{ env.QE_PREFIX }}" \
            MPIF90=mpif90
          
          # Modify make.inc to add FFTW3 support and ensure correct library paths
          if [ -f make.inc ]; then
            # Add -D__FFTW3 to DFLAGS
            sed -i.bak 's/^DFLAGS.*/& -D__FFTW3/' make.inc
            # Add FFTW3 include path to FFLAGS (if not already present)
            if ! grep -q "I/usr/include" make.inc; then
              sed -i.bak "s|^FFLAGS.*|& -I/usr/include|" make.inc
            fi
          fi
        else
          # Configure QE for macOS with install prefix
          # Get brew paths
          FFTW_PREFIX=$(brew --prefix fftw)
          
          # CC, FC, and CPP should already be set in GITHUB_ENV (with ccache wrapper)
          ./configure \
            --prefix="${{ env.QE_PREFIX }}" \
            CC="$CC" \
            FC="$FC" \
            CPP="$CPP" \
            BLAS_LIBS="-framework Accelerate" \
            LAPACK_LIBS="" \
            FFT_LIBS="-L${FFTW_PREFIX}/lib -lfftw3" \
            MPIF90=mpif90
          
          # Modify make.inc to add FFTW3 support
          if [ -f make.inc ]; then
            # Add -D__FFTW3 to DFLAGS
            sed -i.bak 's/^DFLAGS.*/& -D__FFTW3/' make.inc
            # Add FFTW3 include path to FFLAGS
            sed -i.bak "s|^FFLAGS.*|& -I${FFTW_PREFIX}/include|" make.inc
          fi
        fi
        
        # Build QE (essential modules for testing) with parallel compilation
        # Use 2 cores for compilation to speed up
        make pw -j2 || make pw
        make ph -j2 || make ph
        make pp -j2 || make pp
        # dos.x is built automatically with pw.x, no need for explicit make
        
        # Install QE to prefix
        make install
    
    - name: Set QE environment variables
      run: |
        echo "QE_HOME=${{ env.QE_PREFIX }}" >> $GITHUB_ENV
        echo "${{ env.QE_PREFIX }}/bin" >> $GITHUB_PATH
    
    - name: Verify QE installation
      run: |
        export QE_HOME="${{ env.QE_PREFIX }}"
        export PATH="${{ env.QE_PREFIX }}/bin:$PATH"
        which pw.x || (echo "pw.x not found in PATH" && exit 1)
        pw.x --version || echo "pw.x version check failed (may be normal)"
        ls -la ${{ env.QE_PREFIX }}/bin/pw.x || exit 1
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    
    - name: Run all tests in tests/ directory
      run: |
        export QE_HOME="${{ env.QE_PREFIX }}"
        export PATH="${{ env.QE_PREFIX }}/bin:$PATH"
        python -m pytest tests/ -v -s --tb=short -n auto --dist=loadfile --cov=src/quantumvitas --cov-report=xml --cov-report=term
      env:
        QE_HOME: ${{ env.QE_PREFIX }}
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: tests-qe
        name: codecov-umbrella
        fail_ci_if_error: false
    
    # GUI E2E Tests (Electron + Playwright) - Cross-platform
    # IMPORTANT: E2E tests always run on push (no conditional skipping)
    # E2E tests run AFTER QE compilation to ensure QE binaries are available
    # The demo_calculation_run.spec.ts test requires QE to be installed and on PATH
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gui/package-lock.json
    
    - name: Configure npm for resiliency
      working-directory: gui
      run: |
        npm config set fetch-retries 5
        npm config set fetch-retry-factor 2
        npm config set fetch-retry-mintimeout 20000
        npm config set fetch-retry-maxtimeout 120000
        npm config set fund false
        npm config set audit false
    
    - name: Install GUI dependencies
      working-directory: gui
      run: npm ci
    
    - name: Install Playwright browsers
      working-directory: gui
      run: npx playwright install --with-deps chromium
    
    - name: Build Electron app for E2E tests
      working-directory: gui
      run: npm run build:e2e
    
    - name: Run GUI E2E tests
      working-directory: gui
      run: |
        export QE_HOME="${{ env.QE_PREFIX }}"
        export PATH="${{ env.QE_PREFIX }}/bin:$PATH"
        # Unified E2E tests - fixture automatically chooses launch strategy:
        # Linux: uses Playwright's _electron.launch()
        # macOS: uses CDP workaround
        # All tests run on both platforms (no conditional skipping)
        if [ "${{ matrix.os }}" == "ubuntu-22.04" ]; then
          # Use xvfb for headless display on Linux
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npx playwright test \
            tests/e2e/welcome.spec.ts \
            tests/e2e/demo_calculation.spec.ts \
            tests/e2e/demo_calculation_run.spec.ts \
            tests/e2e/demo_gallery.spec.ts \
            tests/e2e/step_defaults.spec.ts \
            --project=electron
        else
          # macOS runs directly (no xvfb needed)
          npx playwright test \
            tests/e2e/welcome.spec.ts \
            tests/e2e/demo_calculation.spec.ts \
            tests/e2e/demo_calculation_run.spec.ts \
            tests/e2e/demo_gallery.spec.ts \
            tests/e2e/step_defaults.spec.ts \
            --project=electron
        fi
      env:
        QE_HOME: ${{ env.QE_PREFIX }}
        CI: true
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.os }}
        path: gui/test-results/
        retention-days: 30

  extended-tests:
    name: Extended Tests (Manual)
    runs-on: ubuntu-22.04
    # Only run on manual trigger or schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    
    - name: Setup QE (if available)
      run: |
        # This would need to be configured based on your CI setup
        # For now, extended tests will be skipped if QE is not available
        echo "QE setup would go here"
    
    - name: Run extended tests
      run: |
        pytest extended-tests/ -m extended -v --maxfail=10
      continue-on-error: true  # Don't fail CI if extended tests fail
    
    - name: Analyze results
      if: always()
      run: |
        # If results file exists, analyze it
        if [ -f extended_test_results.json ]; then
          python extended-tests/analyze_results.py extended_test_results.json
        fi
