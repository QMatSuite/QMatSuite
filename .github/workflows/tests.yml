name: Tests

on:
  push:
    # Only run on v2-python branch
    branches: [ v2-python ]
  pull_request:
    # Only run PRs targeting v2-python branch
    branches: [ v2-python ]

jobs:
  tests-with-qe:
    name: Tests with QE (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.12']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get upgrade -y
        sudo apt-get install --no-install-recommends -y \
          build-essential \
          gfortran \
          libfftw3-dev \
          libopenblas-dev \
          liblapack-dev \
          libscalapack-mpi-dev \
          libfftw3-mpi-dev \
          libhdf5-serial-dev \
          mpich \
          libmpich-dev \
          wget \
          make
    
    - name: Install system dependencies and setup compilers (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install gcc gfortran openmpi fftw wget make
        
        # Get gcc prefix and detect versioned gcc
        GCC_PREFIX=$(brew --prefix gcc)
        
        # Find all versioned gcc (gcc-15, gcc-16, gcc-17, etc.) and select the highest version
        GCC_VERSIONS=$(ls "$GCC_PREFIX/bin"/gcc-* 2>/dev/null | grep -E 'gcc-[0-9]+$' | sed 's/.*gcc-\([0-9]*\)$/\1/' | sort -rn)
        if [ -n "$GCC_VERSIONS" ]; then
          # Use the highest version found
          HIGHEST_VERSION=$(echo "$GCC_VERSIONS" | head -1)
          echo "CC=$GCC_PREFIX/bin/gcc-$HIGHEST_VERSION" >> $GITHUB_ENV
          # Use matching versioned cpp
          echo "CPP=$GCC_PREFIX/bin/cpp-$HIGHEST_VERSION" >> $GITHUB_ENV
        else
          # Fallback to non-versioned
          echo "CC=$GCC_PREFIX/bin/gcc" >> $GITHUB_ENV
          echo "CPP=$GCC_PREFIX/bin/cpp" >> $GITHUB_ENV
        fi
        
        # Use symbolic link gfortran (if exists), otherwise fallback
        if [ -f "$GCC_PREFIX/bin/gfortran" ]; then
          echo "FC=$GCC_PREFIX/bin/gfortran" >> $GITHUB_ENV
        else
          echo "FC=$(which gfortran)" >> $GITHUB_ENV
        fi
        
        echo "PATH=$GCC_PREFIX/bin:$PATH" >> $GITHUB_ENV
    
    - name: Cache QE source
      uses: actions/cache@v3
      with:
        path: $HOME/src/q-e-qe-7.5
        key: qe-source-7.5-${{ runner.os }}
    
    - name: Install Quantum ESPRESSO (from source)
      run: |
        # Create QE installation directory
        mkdir -p $HOME/src
        cd $HOME/src
        
        # Download QE 7.5 source (if not cached)
        if [ ! -d "q-e-qe-7.5" ]; then
          wget -q https://gitlab.com/QEF/q-e/-/archive/qe-7.5/q-e-qe-7.5.tar.gz
          tar -xzf q-e-qe-7.5.tar.gz
          rm q-e-qe-7.5.tar.gz
        fi
        
        cd q-e-qe-7.5
        
        if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
          # Configure QE for Ubuntu
          # Let configure auto-detect most libraries, but explicitly set MPI
          ./configure \
            MPIF90=mpif90
          
          # Modify make.inc to add FFTW3 support and ensure correct library paths
          if [ -f make.inc ]; then
            # Add -D__FFTW3 to DFLAGS
            sed -i.bak 's/^DFLAGS.*/& -D__FFTW3/' make.inc
            # Add FFTW3 include path to FFLAGS (if not already present)
            if ! grep -q "I/usr/include" make.inc; then
              sed -i.bak "s|^FFLAGS.*|& -I/usr/include|" make.inc
            fi
          fi
        else
          # Configure QE for macOS
          # Get brew paths
          FFTW_PREFIX=$(brew --prefix fftw)
          
          # CC, FC, and CPP should already be set in GITHUB_ENV
          ./configure \
            CC="$CC" \
            FC="$FC" \
            CPP="$CPP" \
            BLAS_LIBS="-framework Accelerate" \
            LAPACK_LIBS="" \
            FFT_LIBS="-L${FFTW_PREFIX}/lib -lfftw3" \
            MPIF90=mpif90
          
          # Modify make.inc to add FFTW3 support
          if [ -f make.inc ]; then
            # Add -D__FFTW3 to DFLAGS
            sed -i.bak 's/^DFLAGS.*/& -D__FFTW3/' make.inc
            # Add FFTW3 include path to FFLAGS
            sed -i.bak "s|^FFLAGS.*|& -I${FFTW_PREFIX}/include|" make.inc
          fi
        fi
        
        # Build QE (essential modules for testing) with parallel compilation
        # Use 2 cores for compilation to speed up
        make pw -j2 || make pw
        make ph -j2 || make ph
        make pp -j2 || make pp
        # dos.x is built automatically with pw.x, no need for explicit make
        
        # Set QE_HOME environment variable
        echo "QE_HOME=$HOME/src/q-e-qe-7.5" >> $GITHUB_ENV
        echo "$HOME/src/q-e-qe-7.5/bin" >> $GITHUB_PATH
    
    - name: Verify QE installation
      run: |
        QE_HOME=$HOME/src/q-e-qe-7.5
        export QE_HOME
        export PATH="$QE_HOME/bin:$PATH"
        which pw.x || (echo "pw.x not found in PATH" && exit 1)
        pw.x --version || echo "pw.x version check failed (may be normal)"
        ls -la $QE_HOME/bin/pw.x || exit 1
        echo "QE_HOME=$QE_HOME" >> $GITHUB_ENV
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    
    - name: Run all tests in tests/ directory
      run: |
        export QE_HOME=$HOME/src/q-e-qe-7.5
        export PATH="$QE_HOME/bin:$PATH"
        pytest tests/ -v --cov=src/quantumvitas --cov-report=xml --cov-report=term
        echo "QE_HOME=$HOME/src/q-e-qe-7.5" >> $GITHUB_ENV
      env:
        QE_HOME: ${{ env.QE_HOME }}
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: tests-qe
        name: codecov-umbrella
        fail_ci_if_error: false
    
    # GUI E2E Tests (Electron + Playwright) - Linux only
    # Note: macOS has compatibility issues with Playwright's Electron debugging
    - name: Setup Node.js
      if: matrix.os == 'ubuntu-latest'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: gui/package-lock.json
    
    - name: Install GUI dependencies
      if: matrix.os == 'ubuntu-latest'
      working-directory: gui
      run: npm ci
    
    - name: Install Playwright browsers
      if: matrix.os == 'ubuntu-latest'
      working-directory: gui
      run: npx playwright install --with-deps chromium
    
    - name: Run GUI E2E tests (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: gui
      run: |
        export QE_HOME=$HOME/src/q-e-qe-7.5
        export PATH="$QE_HOME/bin:$PATH"
        # Use xvfb for headless display on Linux
        xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" npm run test:e2e
      env:
        QE_HOME: ${{ env.QE_HOME }}
        CI: true
    
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: always() && matrix.os == 'ubuntu-latest'
      with:
        name: playwright-report-${{ matrix.os }}
        path: gui/test-results/
        retention-days: 30

  extended-tests:
    name: Extended Tests (Manual)
    runs-on: ubuntu-latest
    # Only run on manual trigger or schedule
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    
    - name: Setup QE (if available)
      run: |
        # This would need to be configured based on your CI setup
        # For now, extended tests will be skipped if QE is not available
        echo "QE setup would go here"
    
    - name: Run extended tests
      run: |
        pytest extended-tests/ -m extended -v --maxfail=10
      continue-on-error: true  # Don't fail CI if extended tests fail
    
    - name: Analyze results
      if: always()
      run: |
        # If results file exists, analyze it
        if [ -f extended_test_results.json ]; then
          python extended-tests/analyze_results.py extended_test_results.json
        fi
