[pytest]
# Pytest configuration for QuantumVITAS

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
# Quick tests: tests/ (run in CI)
# Extended tests: extended-tests/ (developer only)
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src/quantumvitas
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for test categorization
markers =
    quick: Quick tests that run in CI (tests/)
    extended: Extended tests that require full QE test-suite (extended-tests/)
    unit: Tests that do not execute QE binaries (pure Python / IO)
    integration: Integration tests that may perform real network requests or external system calls
    network: Tests that require network access (real HTTP requests)
    qe_core: Tests that run QE via the engine helpers
    qe_cli: Tests that run QE via the Typer CLI
    requires_qe: Tests that require a QE installation (legacy marker used by extended-tests)
    requires_test_suite: Tests that require the QE official test-suite
    orca: Tests specific to ORCA engine (require ORCA binary)

# Coverage options
[coverage:run]
source = src/quantumvitas
omit = 
    */tests/*
    */extended-tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
