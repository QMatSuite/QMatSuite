[pytest]
# Pytest configuration for QuantumVITAS

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
# Quick tests: tests/ (run in CI)
# Extended tests: extended-tests/ (developer only)
testpaths = tests

# Output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=src/quantumvitas
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Markers for test categorization
markers =
    quick: Quick tests that run in CI (tests/)
    extended: Extended tests that require full QE test-suite (extended-tests/)
    unit: Unit tests
    integration: Integration tests
    qe_testsuite: Tests using QE official test-suite
    bidirectional: Bidirectional conversion tests
    slow: Tests that take a long time to run
    requires_qe: Tests that require QE installation
    requires_test_suite: Tests that require QE test-suite

# Coverage options
[coverage:run]
source = src/quantumvitas
omit = 
    */tests/*
    */extended-tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
