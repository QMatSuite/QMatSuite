case_id: copper_wannier
engine: qe
title: Copper Wannier functions with disentanglement (QE to W90 pipeline)
description: >-
  Full QE->Wannier90 composite pipeline for copper with disentanglement.
  SCF -> NSCF -> wannier90 -pp -> pw2wannier90 -> wannier90.
  Based on Wannier90 Tutorial Example 6. Tests disentanglement parameters
  (dis_win_max, dis_froz_max, dis_num_iter) and kpoint_path for band
  interpolation. The .win file is PARSED by the W90 engine parser.
