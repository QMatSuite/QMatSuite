case_id: he_qmcpack_vmc
engine: qe
title: He atom QE to QMCPACK VMC pipeline
description: >-
  Minimal QE->QMCPACK composite pipeline for He atom VMC.
  SCF -> pw2qmcpack -> QMCPACK VMC. All-electron He atom with STO basis
  and Pade Jastrow. No pseudopotentials needed for the QMC step.
  The QMCPACK XML input is parsed by the QMCPACK engine parser.
