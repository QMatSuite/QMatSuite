title: LiH solid QE to QMCPACK VMC pipeline
description: 'LiH solid-state VMC total energy calculation using the QE→QMCPACK pipeline:
  DFT-PBE SCF produces the trial wavefunction, pw2qmcpack converts it to HDF5, and
  QMCPACK runs VMC sampling with BFD pseudopotentials.'
