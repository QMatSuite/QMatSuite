case_id: si_yambo_bse
engine: qe
title: Silicon BSE Haydock (QE to Yambo BSE pipeline)
description: >-
  Full QE->Yambo composite pipeline for Si BSE optical spectrum.
  SCF -> NSCF -> yambo_setup (runs p2y internally) -> yambo_bse.
  BSE with SEX kernel and Haydock iterative solver.
  The Yambo .in file is parsed by the Yambo engine parser.
