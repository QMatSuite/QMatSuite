title: Diamond sp3 Wannier functions (QE to W90 pipeline)
description: >-
  Full QE->Wannier90 composite pipeline for diamond sp3 Wannier functions.
  SCF -> NSCF -> wannier90 -pp -> pw2wannier90 -> wannier90.
  Based on Wannier90 Tutorial Example 5. The .win file is PARSED by the W90
  engine parser into YAML params (not staged as raw file).
